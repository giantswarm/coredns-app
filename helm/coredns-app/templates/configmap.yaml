{{- $dnsPort := .Values.ports.dns.targetPort }}
{{- $metricsPort := .Values.ports.metrics.port }}
{{- $autopath := .Values.coredns.public.autopath }}
{{- $serviceCIDR := .Values.coredns.cluster.serviceCIDR }}
{{- $podCIDR := .Values.coredns.cluster.podCIDR }}
{{- $custom := .Values.coredns.custom }}

{{- $domains := .Values.coredns.cluster.domains }}

{{- $additionalZones := .Values.coredns.additionalZones }}

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
data:
  Corefile: |
    {{- $publicZone := .Values.coredns.public }}
    .:{{ $dnsPort }} {
        {{- with include "coredns.cacheBlock" (dict "zone" $publicZone) }}{{ . | nindent 8 }}{{ end }}
        errors
        {{- with include "coredns.templateBlock" (dict "zone" $publicZone) }}{{ . | nindent 8 }}{{ end }}
        health :8080 {
          lameduck 5s
        }
        ready :8181
        {{- with include "coredns.logBlock" (dict "zone" $publicZone) }}{{ . | nindent 8 }}{{ end }}
        {{- include "coredns.loadbalanceBlock" (dict "zone" $publicZone) | nindent 8 }}
        prometheus :{{ $metricsPort }}
        {{- include "coredns.forwardBlock" (dict "zone" $publicZone) | nindent 8 }}
        {{- with include "coredns.rewriteBlock" (dict "zone" $publicZone) }}{{ . | nindent 8 }}{{ end }}
        reload
        {{- if $autopath }}
        autopath {{ $autopath }}
        {{- end }}
    }
    {{- range $index, $domain := $domains }}
    {{- $cidrsList := list }}
    {{- if (regexMatch ".local$" $domain) }}{{ $cidrsList = list $serviceCIDR $podCIDR }}{{ end }}
    {{- $clusterZone := merge (dict "names" (list $domain) "cidrs" $cidrsList) $.Values.coredns.cluster }}
    {{ $domain }}:{{ $dnsPort }} {{- if (regexMatch ".local$" $domain ) }} {{ $serviceCIDR }}:{{ $dnsPort }} {{ $podCIDR }}:{{ $dnsPort }} {{- end }} {
        errors
        {{- with include "coredns.templateBlock" (dict "zone" $clusterZone) }}{{ . | nindent 8 }}{{ end }}
        {{- with include "coredns.cacheBlock" (dict "zone" $clusterZone) }}{{ . | nindent 8 }}{{ end }}
        ready :8181
        {{- include "coredns.kubernetesBlock" (dict "zone" $clusterZone) | nindent 8 }}
        {{- with include "coredns.logBlock" (dict "zone" $clusterZone) }}{{ . | nindent 8 }}{{ end }}
        {{- include "coredns.loadbalanceBlock" (dict "zone" $clusterZone) | nindent 8 }}
        {{- with include "coredns.rewriteBlock" (dict "zone" $clusterZone) }}{{ . | nindent 8 }}{{ end }}
        prometheus :{{ $metricsPort }}
    }
    {{- end }}
    {{- if $additionalZones }}
    {{- range $zone := $additionalZones }}
    {{- $names := list }}
    {{- range $zone.names }}{{ $names = append $names (printf "%s:%v" . $dnsPort) }}{{ end }}
    {{- range ($zone.cidrs | default list) }}{{ $names = append $names (printf "%s:%v" . $dnsPort) }}{{ end }}
    {{ join " " $names }} {
        errors
        {{- with include "coredns.templateBlock" (dict "zone" $zone) }}{{ . | nindent 8 }}{{ end }}
        {{- with include "coredns.cacheBlock" (dict "zone" $zone) }}{{ . | nindent 8 }}{{ end }}
        {{- if $zone.kubernetes }}
        ready :8181
        {{- include "coredns.kubernetesBlock" (dict "zone" $zone) | nindent 8 }}
        {{- end }}
        {{- if $zone.forward }}
        {{- include "coredns.forwardBlock" (dict "zone" $zone) | nindent 8 }}
        {{- end }}
        {{- with include "coredns.logBlock" (dict "zone" $zone) }}{{ . | nindent 8 }}{{ end }}
        {{- include "coredns.loadbalanceBlock" (dict "zone" $zone) | nindent 8 }}
        {{- with include "coredns.rewriteBlock" (dict "zone" $zone) }}{{ . | nindent 8 }}{{ end }}
        prometheus :{{ $metricsPort }}
    }
    {{- end }}
    {{- end }}
    {{- if $custom }}
    {{- range ($custom | trimAll "\n " | splitList "\n") }}
    {{ . }}
    {{- end }}
    {{- end }}
