# Per-Deployment update strategies layered over the shared updateStrategy.
# Expected: coredns-controlplane renders type Recreate with no rollingUpdate;
# coredns-workers renders maxSurge 50% and maxUnavailable 0, keeping the
# explicit 0 over the shared maxUnavailable 1.
# Layered on top of ci-values.yaml by the render-diff CI.
updateStrategy:
  rollingUpdate:
    maxUnavailable: 1
controlPlane:
  updateStrategy:
    type: Recreate
workers:
  updateStrategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 50%
